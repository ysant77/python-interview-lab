name: Python tests
on:
  push:
  pull_request:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal tests
        run: python -m pip install -e '.[test]'
      - name: Verify catalog index
        run: python scripts/verify_catalog.py
      - name: Run core tests
        run: python -m pytest -q
  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy, PyTorch and tests
        run: python -m pip install -e '.[test,ml]'
      - name: Test NumPy and PyTorch code
        run: python -m pytest -q
